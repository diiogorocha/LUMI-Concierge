<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Tour Virtual Valores</title>
<!-- LUMI Concierge · tabela de preço enxuta (versão 2, 2026-10-23, após reprovação da dona).
     Medidas copiadas de contexto/materiais/tabela-tour-presencial.webp. Valores: contexto/oferta.md.
     Gera PNG 1080x1350 (tela) e PDF A4 (impressão). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Lato:ital,wght@0,400;0,700;1,400&display=block" rel="stylesheet">
<style>
:root{
  --marinho:#0F3C5D; --creme:#FEFAEF; --dourado:#B68237;
  --ardosia:#395B74; --areia:#F1E8D8; --linha:#E3D8C4;
  --dourado-escuro:#8A5F22; --mel:#F6EBD3;
  --serif:"Cormorant Garamond", Garamond, Georgia, serif;
  --sans:"Lato", "Helvetica Neue", Arial, sans-serif;
  /* medidas em px no canvas 1080x1350, copiadas da tabela original da dona */
  --row:91px; --num:26px;
}
body.r6{ --row:80px; }
body.r12{ --row:54px; --num:21px; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--creme)}
body{color:var(--marinho);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums tabular-nums}
.page{width:1080px;height:1350px;padding:90px 90px 0;background:var(--creme);overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center;height:56px}
.logo{height:56px;width:auto;display:block}
.seal{border:1.5px solid var(--dourado-escuro);color:var(--dourado-escuro);border-radius:999px;padding:13px 24px;font:700 13px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
h1{font:600 54px/64px var(--serif);margin:76px 0 0;color:var(--marinho);letter-spacing:-.005em;font-variant-numeric:lining-nums}
.rule{width:70px;height:4px;background:var(--dourado);border:0;margin:20px 0 0}
.sub{font:italic 400 18px/1.3 var(--sans);color:var(--ardosia);margin:22px 0 0}
.tbl{margin-top:44px}
body.r12 .tbl{margin-top:40px}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--marinho)}
th{color:var(--creme);font:700 14px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-align:left;height:64px;padding:0 35px}
body.r12 th{height:56px}
th:last-child,td:last-child{text-align:right}
td{height:var(--row);padding:0 35px;border-bottom:1px solid var(--linha);vertical-align:middle;font:400 var(--num)/1 var(--sans);white-space:nowrap;color:var(--marinho);font-variant-numeric:lining-nums tabular-nums}
tbody tr:nth-child(even) td{background:var(--areia)}
.three th:nth-child(2),.three td:nth-child(2){text-align:right}
td.v{color:var(--ardosia)}
td.c{color:var(--dourado-escuro)}
tr.disc td{background:var(--mel) !important}
tr.disc td.p{color:var(--dourado-escuro)}
s{font:400 15px/1 var(--sans);color:var(--ardosia);margin-right:14px;vertical-align:2px}
.tag{display:inline-block;margin-left:14px;color:var(--dourado-escuro);border:1px solid var(--dourado-escuro);border-radius:999px;padding:4px 8px;font:700 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;vertical-align:4px}
.foot{font:italic 400 16px/1.3 var(--sans);color:var(--ardosia);margin:28px 0 0}

/* PDF A4: a mesma página reduzida para 210 mm de largura; sobra respiro embaixo */
@page{size:A4;margin:0}
@media print{
  .page{zoom:calc(210 / 285.75);height:1527px}
}
</style>
</head>
<body class="r6">
<main class="page">
  <header class="head">
    <img class="logo" src="logo-lumi-positivo-recortado.png" alt="LUMI Concierge">
    <span class="seal">Valores</span>
  </header>
  <h1>Experiência LUMI<br>nos Parques</h1>
  <hr class="rule">
  <div class="tbl"><table class="">
    <thead><tr><th>Participantes</th><th>Valor do tour</th></tr></thead>
    <tbody>
      <tr><td class="n">1–5</td><td class="p">$200</td></tr>
      <tr><td class="n">6</td><td class="p">$250</td></tr>
      <tr><td class="n">7</td><td class="p">$300</td></tr>
      <tr><td class="n">8</td><td class="p">$350</td></tr>
      <tr><td class="n">9</td><td class="p">$400</td></tr>
      <tr><td class="n">10</td><td class="p">$450</td></tr>
    </tbody>
  </table></div>
  <p class="foot">Valor por parque · por dia</p>
</main>
</body>
</html>
