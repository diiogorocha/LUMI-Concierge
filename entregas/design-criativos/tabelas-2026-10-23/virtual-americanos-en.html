<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Virtual Park Guidance Pricing</title>
<!-- LUMI Concierge · tabela de preço enxuta (versão 5, 2026-10-23: título = serviço; parceiros com a comissão em dourado caixa alta; estrela logo abaixo da tabela).
     Medidas copiadas de contexto/materiais/tabela-tour-presencial.webp. Valores: contexto/oferta.md.
     Gera PNG 1080x1350 (tela) e PDF A4 (impressão). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Lato:ital,wght@0,400;0,700;1,400&display=block" rel="stylesheet">
<style>
:root{
  --marinho:#0F3C5D; --creme:#FEFAEF; --dourado:#B68237;
  --ardosia:#395B74; --areia:#F1E8D8; --linha:#E3D8C4;
  --dourado-escuro:#8A5F22; --mel:#F6EBD3;
  --serif:"Cormorant Garamond", Garamond, Georgia, serif;
  --sans:"Lato", "Helvetica Neue", Arial, sans-serif;
  /* medidas em px no canvas 1080x1350, copiadas da tabela original da dona */
  --row:91px; --num:26px;
}
body.r6{ --row:80px; }
body.r12{ --row:54px; --num:21px; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--creme)}
body{color:var(--marinho);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums tabular-nums}
.page{width:1080px;height:1350px;padding:90px;background:var(--creme);overflow:hidden;display:flex;flex-direction:column}
.head{display:flex;justify-content:space-between;align-items:center;height:56px}
.logo{height:56px;width:auto;display:block}
.seal{border:1.5px solid var(--dourado-escuro);color:var(--dourado-escuro);border-radius:999px;padding:13px 24px;font:700 13px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.sub{font:700 16px/1.2 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--dourado-escuro);margin:14px 0 0}
h1{font:600 54px/64px var(--serif);margin:64px 0 0;color:var(--marinho);letter-spacing:-.005em;font-variant-numeric:lining-nums}
.rule{width:70px;height:4px;background:var(--dourado);border:0;margin:20px 0 0}
.tbl{margin-top:44px}
body.r12 .tbl{margin-top:40px}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--marinho)}
th{color:var(--creme);font:700 14px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-align:left;height:64px;padding:0 35px}
body.r12 th{height:56px}
th:last-child,td:last-child{text-align:right}
td{height:var(--row);padding:0 35px;border-bottom:1px solid var(--linha);vertical-align:middle;font:400 var(--num)/1 var(--sans);white-space:nowrap;color:var(--marinho);font-variant-numeric:lining-nums tabular-nums}
tbody tr:nth-child(even) td{background:var(--areia)}
.three th:nth-child(2),.three td:nth-child(2){text-align:right}
td.v{color:var(--ardosia)}
td.c{color:var(--dourado-escuro)}
tr.disc td{background:var(--mel) !important}
tr.disc td.p{color:var(--dourado-escuro)}
s{font:400 15px/1 var(--sans);color:var(--ardosia);margin-right:14px;vertical-align:2px}
.tag{display:inline-block;margin-left:14px;color:var(--dourado-escuro);border:1px solid var(--dourado-escuro);border-radius:999px;padding:4px 8px;font:700 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;vertical-align:4px}
.note{margin:28px 0 0;background:var(--areia);border-left:5px solid var(--dourado);border-radius:0 5px 5px 0;padding:15px 20px;font:400 19px/1.4 var(--sans);color:var(--marinho)}
body.r12 .note{margin-top:24px}
body.r12 .foot{margin-top:22px}
.foot{margin:26px 0 0;display:flex;align-items:center;gap:10px;font:700 21px/1.2 var(--sans);color:var(--marinho)}
.star{width:21px;height:21px;fill:var(--dourado);flex:none}

/* PDF A4: a mesma página reduzida para 210 mm de largura; sobra respiro embaixo */
@page{size:A4;margin:0}
@media print{
  .page{zoom:calc(210 / 285.75);height:1527px;padding-bottom:110px}
}
</style>
</head>
<body class="r12">
<main class="page">
  <header class="head">
    <img class="logo" src="logo-lumi-positivo-recortado.png" alt="LUMI Concierge">
    <span class="seal">Pricing</span>
  </header>
  <h1>Virtual Park Guidance</h1>
  <p class="sub">U.S. clients · USD</p>
  <hr class="rule">
  <div class="tbl"><table class="">
    <thead><tr><th>Guests</th><th>Price</th></tr></thead>
    <tbody>
      <tr><td class="n">1–2</td><td class="p">$200</td></tr>
      <tr><td class="n">3–5</td><td class="p">$250</td></tr>
      <tr><td class="n">6</td><td class="p">$300</td></tr>
      <tr><td class="n">7</td><td class="p">$350</td></tr>
      <tr><td class="n">8</td><td class="p">$400</td></tr>
      <tr><td class="n">9</td><td class="p">$450</td></tr>
      <tr><td class="n">10</td><td class="p">$500</td></tr>
      <tr class="disc"><td class="n">11<span class="tag">5% off</span></td><td class="p"><s>$550</s>$522</td></tr>
      <tr class="disc"><td class="n">12<span class="tag">5% off</span></td><td class="p"><s>$600</s>$570</td></tr>
      <tr class="disc"><td class="n">13<span class="tag">5% off</span></td><td class="p"><s>$650</s>$617</td></tr>
      <tr class="disc"><td class="n">14<span class="tag">5% off</span></td><td class="p"><s>$700</s>$665</td></tr>
      <tr class="disc"><td class="n">15<span class="tag">5% off</span></td><td class="p"><s>$750</s>$712</td></tr>
    </tbody>
  </table></div>
  <p class="note">From 11 guests: 5% off the total.</p>
  <p class="foot"><svg class="star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 0 C52.5 34 58 44 100 50 C58 56 52.5 66 50 100 C47.5 66 42 56 0 50 C42 44 47.5 34 50 0Z"/></svg>Price per park, per day</p>
</main>
</body>
</html>
